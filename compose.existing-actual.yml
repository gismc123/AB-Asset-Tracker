# Setup A: the add-on only, in front of an Actual server you already run on
# this host (for example from its own docker-compose file, publishing port
# 5006). Your existing Actual container is not modified, restarted, or
# reconfigured. Selected by COMPOSE_FILE=compose.existing-actual.yml in .env.
#
#   docker compose up -d
#
# The name "actual" is mapped to the Docker host, so the backend and proxy
# reach your server at https://actual:5006. Self-signed certificates that
# list "actual" as a name then verify without disabling TLS checks.

services:
  asset-tracker-backend:
    extends:
      file: compose.addon.yml
      service: asset-tracker-backend
    extra_hosts:
      - "actual:host-gateway"

  asset-tracker-proxy:
    extends:
      file: compose.addon.yml
      service: asset-tracker-proxy
    extra_hosts:
      - "actual:host-gateway"
    depends_on:
      - asset-tracker-backend
