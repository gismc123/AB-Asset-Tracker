# Add-on only, in front of an Actual server you already run on this host
# (for example from its own docker-compose file, publishing port 5006).
# Your existing Actual container is not modified, restarted, or reconfigured.
#
#   docker compose -f compose.existing-actual.yml up -d
#
# The name "actual" is mapped to the Docker host, so the backend and proxy
# reach your server at https://actual:5006. Self-signed certificates that
# list "actual" as a name then verify without disabling TLS checks.

services:
  mortgage-backend:
    extends:
      file: compose.addon.yml
      service: mortgage-backend
    extra_hosts:
      - "actual:host-gateway"

  mortgage-proxy:
    extends:
      file: compose.addon.yml
      service: mortgage-proxy
    extra_hosts:
      - "actual:host-gateway"
    depends_on:
      - mortgage-backend
