# The two add-on containers: the tracker backend and the injecting proxy.
# Neither of them is Actual. Updating Actual never touches these, and
# rebuilding these never touches Actual.
#
# You never run this file directly. COMPOSE_FILE in .env picks one of:
#   compose.existing-actual.yml   A: add-on in front of an Actual you already run
#   docker-compose.yml            B: bundled, Actual + add-on

services:
  asset-tracker-backend:
    build: .
    image: ab-asset-tracker-backend:local
    # Always built here, never pulled: no "pull access denied" warnings, and
    # `docker compose up -d` after a `git pull` rebuilds what changed.
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${BACKEND_PORT:-3100}
      DATA_DIR: /data
      # Lets Node trust a self-signed Actual certificate (empty = system CAs only).
      NODE_EXTRA_CA_CERTS: ${ACTUAL_CA_CERT:-}
    volumes:
      - ./data:/data
      - ${ACTUAL_CERT_DIR:-./certs}:/certs:ro
    expose:
      - ${BACKEND_PORT:-3100}

  asset-tracker-proxy:
    build: ./proxy
    image: ab-asset-tracker-proxy:local
    pull_policy: build
    restart: unless-stopped
    environment:
      ACTUAL_UPSTREAM: ${ACTUAL_UPSTREAM:?Set ACTUAL_UPSTREAM in .env}
      TRACKER_BACKEND: http://asset-tracker-backend:${BACKEND_PORT:-3100}
      # File names inside ACTUAL_CERT_DIR (mounted at /certs).
      TLS_CERT_FILE: ${TLS_CERT_FILE:-tls.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-tls.key}
      # off = plain HTTP, for a Cloudflare Tunnel or reverse proxy that handles HTTPS.
      PROXY_TLS: ${PROXY_TLS:-on}
    volumes:
      # Read-write only so a self-signed pair can be generated on first start
      # when the folder is empty. Existing files are never overwritten.
      - ${ACTUAL_CERT_DIR:-./certs}:/certs
    ports:
      - "${PROXY_PORT:-5007}:8443"
    depends_on:
      - asset-tracker-backend
